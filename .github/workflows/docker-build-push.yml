name: Build and push Docker images

on:
  workflow_call:

    inputs:
      DOCKER_REPOSITORY:
        description: The Docker Hub organization/user and repository name.
        required: true
        type: string
      DOCKERFILE_PATH:
        description: The Dockerfile path relative to the source repository.
        type: string
        default: ./docker/prod/Dockerfile
      BUILD_TAG:
        description: Tag to build, e.g. 1, 1.2 or 1.2.3. Major needs to match with selected release branch.
        type: string
        default: ''

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      BUILD_ARGS:
        description: Docker build arguments.

permissions:
  contents: read

env:
  # Branch: E.g. release/v1.
  RELEASE_BRANCH_PATTERN: '^refs/heads/release/v(0|[1-9][0-9]*)$'
  # Requested tags: E.g. 1, 1.2, 1.2.1, ...
  REQUESTED_TAG_PATTERN: '^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$'
  # Published versions: E.g. 1.2.1.
  VERSION_TAG_PATTERN: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

defaults:
  run:
    shell: bash

jobs:
  production-tags:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tags.outputs.version }}
      major: ${{ steps.tags.outputs.major }}
      minor: ${{ steps.tags.outputs.minor }}
      should_publish_major: ${{ steps.tags.outputs.should_publish_major }}
      should_publish_minor: ${{ steps.tags.outputs.should_publish_minor }}
      should_publish_latest: ${{ steps.tags.outputs.should_publish_latest }}

    steps:
      - if: github.event_name == 'release'
        name: Retrieve release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Strip leading "v".
          version="${RELEASE_TAG#v}"
          
          # =~ operator is used for regex matching in bash.
          [[ "$version" =~ $VERSION_TAG_PATTERN ]] || {
            echo "::error::Release tags must specify a version";
            exit 1;
          }
          
          echo "REQUESTED_TAG=$version" >> "$GITHUB_ENV"

      - if: github.event_name == 'workflow_dispatch'
        name: Retrieve workflow_dispatch tag
        env:
          BUILD_TAG: ${{ inputs.BUILD_TAG }}
        run: |
          # =~ operator is used for regex matching in bash.
          [[ "$GITHUB_REF" =~ $RELEASE_BRANCH_PATTERN ]] || {
            echo "::error::Manual builds must run on a release branch";
            exit 1;
          }
          
          # Uses the previous regex match to extract the major version from the branch name.
          major="${BASH_REMATCH[1]}"
          
          # Sanitize and validate the BUILD_TAG input. Strip leading and trailing whitespace, then strip leading "v".
          tag=$(printf '%s' "$BUILD_TAG" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          tag="${tag#v}"
          [[ "$tag" =~ $REQUESTED_TAG_PATTERN ]] || {
            echo "::error::Provide exactly one tag, e.g. 1, 1.2 or 1.2.1";
            exit 1;
          }
          
          # The requested tag must match the release branch major the workflow dispatch was triggered from.
          [[ "${tag%%.*}" == "$major" ]] || {
            echo "::error::$tag must belong to release/v$major";
            exit 1;
          }
          
          echo "REQUESTED_TAG=$tag" >> "$GITHUB_ENV"

      # We fetch all published releases to determine the latest release
      # and whether the requested tag is the latest for its major/minor version,
      # so that we can determine which docker image tags to publish.
      # We add a "parts" field to each release, which is an array of the major, minor, and patch numbers as integers, so that we can sort and compare them.
      - name: Fetch published GitHub release tags
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -c --arg pattern "$VERSION_TAG_PATTERN" '
              flatten
              | map(
                  select(.draft == false and .prerelease == false)
                  | {tag: .tag_name, version: (.tag_name | ltrimstr("v"))}
                  | select(.version | test($pattern))
                  | .parts = (.version | split(".") | map(tonumber))
                )
              # Sorted from lowest to highest.
              | sort_by(.parts)
            ')
          
          echo "release_tags=$releases" >> "$GITHUB_OUTPUT"
          
          if jq -e 'length > 0' <<< "$releases" > /dev/null; then
            echo "latest_release_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" >> "$GITHUB_OUTPUT"
          fi

      - name: Select release and Docker tags
        id: tags
        env:
          RELEASE_TAGS: ${{ steps.releases.outputs.release_tags }}
          LATEST_RELEASE_TAG: ${{ steps.releases.outputs.latest_release_tag }}
        run: |
          # Filter the GitHub release tags to find the latest that matches the requested tag.
          # E.g. requested tag 1.2 will match 1.2.0, 1.2.1, etc., and we select the latest one.
          selected_release=$(
            jq -ce --arg tag "$REQUESTED_TAG" '
              ($tag | split(".") | map(tonumber)) as $requested
              | map(select(.parts[:($requested | length)] == $requested))
              | if length == 0 then
                  error("No published release matches " + $tag)
                else
                  # Last element is the latest release.
                  .[-1]
                end
            ' <<< "$RELEASE_TAGS"
          )

          # For the selected release, determine whether it is the latest for its major and minor versions,
          # and whether it is the latest release overall, so that we can determine which Docker image tags to publish.
          jq -r \
            --argjson selected_release "$selected_release" \
            --arg latest_release_tag "$LATEST_RELEASE_TAG" '
            def is_newest_in_release_line($count):
              map(select(.parts[:$count] == $selected_release.parts[:$count]))
              | max_by(.parts)
              | .parts == $selected_release.parts;
            {
              major: $selected_release.parts[0],
              minor: ($selected_release.parts[:2] | map(tostring) | join(".")),
              version: $selected_release.tag,
              should_publish_major: is_newest_in_release_line(1),
              should_publish_minor: is_newest_in_release_line(2),
              should_publish_latest: ($selected_release.tag == $latest_release_tag)
            }
            | to_entries[]
            | "\(.key)=\(.value)"
          ' <<< "$RELEASE_TAGS" >> "$GITHUB_OUTPUT"

  production-image:
    needs: production-tags
    runs-on: ubuntu-latest

    concurrency:
      group: docker-production-${{ inputs.DOCKER_REPOSITORY }}
      cancel-in-progress: false
      queue: max

    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.production-tags.outputs.version }}

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@v4

      - name: Generate production tags
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ inputs.DOCKER_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.production-tags.outputs.should_publish_latest }}
            type=semver,pattern={{major}},value=${{ needs.production-tags.outputs.version }},enable=${{ needs.production-tags.outputs.should_publish_major }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.production-tags.outputs.version }},enable=${{ needs.production-tags.outputs.should_publish_minor }}
            type=semver,pattern={{version}},value=${{ needs.production-tags.outputs.version }}
            type=sha

      # https://github.com/docker/login-action
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ secrets.BUILD_ARGS }}
          cache-from: type=registry,ref=${{ inputs.DOCKER_REPOSITORY }}:buildcache-v${{ needs.production-tags.outputs.major }}
          cache-to: type=registry,ref=${{ inputs.DOCKER_REPOSITORY }}:buildcache-v${{ needs.production-tags.outputs.major }},mode=max

      - if: needs.production-tags.outputs.should_publish_latest == 'true'
        name: Sync latest README to Docker Hub
        # https://github.com/peter-evans/dockerhub-description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ inputs.DOCKER_REPOSITORY }}
          short-description: ${{ github.event.repository.description }}

  preview-image:
    if: >-
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'create docker image') || github.event.action == 'closed')) 
      ||
      (github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.ref_name, 'preview/')) 
      ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/'))
    runs-on: ubuntu-latest

    concurrency:
      group: docker-preview-${{ inputs.DOCKER_REPOSITORY }}-${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
      cancel-in-progress: false
      queue: max

    env:
      ONLY_CLEANUP: ${{ github.event_name == 'delete' || github.event.action == 'closed' }}

    steps:
      - name: Generate preview tag
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.DOCKER_REPOSITORY }}
          flavor: latest=false
          tags: type=raw,value=branch-${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}

      - name: Determine preview cache reference
        id: cache
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
        run: |
          tag="${IMAGE_TAG##*:}"
          echo "cache_ref=${IMAGE_TAG%:*}:buildcache-$tag" >> "$GITHUB_OUTPUT"

      - if: env.ONLY_CLEANUP == 'false'
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4

      - if: env.ONLY_CLEANUP == 'false'
        # https://github.com/docker/login-action
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: env.ONLY_CLEANUP == 'false'
        name: Build and push preview image
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@v7
        with:
          push: true
          file: ${{ inputs.DOCKERFILE_PATH }}
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ secrets.BUILD_ARGS }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.cache_ref }},mode=max

      - if: env.ONLY_CLEANUP == 'true'
        name: Delete preview image and cache tags
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
          CACHE_REF: ${{ steps.cache.outputs.cache_ref }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          credentials=$(jq -n --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" \
            '{username: $username, password: $password}')
          token=$(curl -fsS -H 'Content-Type: application/json' -d "$credentials" \
            https://hub.docker.com/v2/users/login/ | jq -er .token)
          
          echo "::add-mask::$token"
          
          for ref in "$IMAGE_TAG" "$CACHE_REF"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
              "https://hub.docker.com/v2/repositories/${ref%:*}/tags/${ref##*:}/")
            [[ "$status" == 204 || "$status" == 404 ]] || {
              echo "::error::Docker Hub tag deletion failed for $ref: HTTP $status";
              exit 1;
            }
          done
