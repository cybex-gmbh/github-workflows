name: Build and push Docker images

on:
  workflow_call:

    inputs:
      DOCKER_REPOSITORY:
        description: The Docker Hub organization/user and repository name.
        required: true
        type: string
      DOCKERFILE_PATH:
        description: The Dockerfile path relative to the source repository. Only used when BAKE_FILE is not set.
        type: string
        default: ./docker/prod/Dockerfile
      BAKE_FILE:
        description: Optional Bake file relative to the source repository. If set, DOCKERFILE_PATH and BUILD_ARGS are ignored.
        type: string
        default: ''
      BAKE_TARGETS:
        description: Bake targets or groups, pass as multiline.
        type: string
        default: default
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      BUILD_ARGS:
        description: Docker build arguments.

permissions:
  contents: read

env:
  # Branch: E.g. release/v1.
  RELEASE_BRANCH_PATTERN: '^refs/heads/release/v(0|[1-9][0-9]*)$'
  # Published tag: E.g. v1.2.1.
  VERSION_TAG_PATTERN: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

defaults:
  run:
    shell: bash

jobs:
  production-image:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    concurrency:
      group: docker-production-${{ inputs.DOCKER_REPOSITORY }}
      cancel-in-progress: false
      queue: max

    steps:
      # We need to initially checkout the repository to determine the latest tag of the release branch for manual builds.
      - if: github.event_name == 'workflow_dispatch'
      # https://github.com/actions/checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Determine build tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'release' ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi
          
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "TAG=$(git tag --merged HEAD --sort=-version:refname | head -n 1)" >> "$GITHUB_ENV"
          fi

      # https://github.com/actions/checkout
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: '0'

      # This check is not possible with release events, as we don't get the info from which branch the release was created.
      - if: github.event_name == 'workflow_dispatch'
        name: Validate dispatch branch
        run: |
          [[ "$GITHUB_REF" =~ $RELEASE_BRANCH_PATTERN ]] || {
            echo "::error::Manual builds must run on a release branch";
            exit 1;
          }

      - name: Validate tag format
        run: |
          [[ "$TAG" =~ $VERSION_TAG_PATTERN ]] || {
            echo "::error::Tag must follow the v{major}.{minor}.{patch} format";
            exit 1;
          }

      - name: Check whether we are building the latest release overall
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_release_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          
          if [[ "$TAG" == "$latest_release_tag" ]]; then
              echo "IS_LATEST_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Determine if tag is latest in its major version
        run: |
          major="${TAG%%.*}"
          echo "MAJOR=$major" >> "$GITHUB_ENV"
          latest_major_tag=$(git tag --merged "origin/release/$major" --sort=-version:refname | head -n 1)
          
          if [[ "$TAG" == "$latest_major_tag" ]]; then
          echo "SHOULD_PUBLISH_MAJOR=true" >> "$GITHUB_ENV"
          fi

      # https://github.com/docker/setup-buildx-action
      - uses: docker/setup-buildx-action@v4

      - name: Generate production tags
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ inputs.DOCKER_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ env.SHOULD_PUBLISH_MAJOR == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=sha

      # https://github.com/docker/login-action
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: inputs.BAKE_FILE == ''
        name: Build and push production image
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ secrets.BUILD_ARGS }}
          cache-from: type=registry,ref=${{ inputs.DOCKER_REPOSITORY }}:buildcache-${{ env.MAJOR }}
          cache-to: type=registry,ref=${{ inputs.DOCKER_REPOSITORY }}:buildcache-${{ env.MAJOR }},mode=max

      - if: inputs.BAKE_FILE != ''
        name: Bake and push production images
        # https://github.com/docker/bake-action
        uses: docker/bake-action@v7
        env:
          CACHE_REF: ${{ inputs.DOCKER_REPOSITORY }}:buildcache-${{ env.MAJOR }}
        with:
          source: .
          files: |
            ${{ inputs.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ inputs.BAKE_TARGETS }}
          push: true
          sbom: true
          provenance: true

      - if: env.IS_LATEST_RELEASE == 'true'
        name: Sync latest README to Docker Hub
        # https://github.com/peter-evans/dockerhub-description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ inputs.DOCKER_REPOSITORY }}
          short-description: ${{ github.event.repository.description }}

  preview-image:
    if: >-
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'create docker image') || github.event.action == 'closed')) 
      ||
      (github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.ref_name, 'preview/')) 
      ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/'))
    runs-on: ubuntu-latest

    concurrency:
      group: docker-preview-${{ inputs.DOCKER_REPOSITORY }}-${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}
      cancel-in-progress: false
      queue: max

    env:
      ONLY_CLEANUP: ${{ github.event_name == 'delete' || github.event.action == 'closed' }}

    steps:
      - name: Generate preview tag
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.DOCKER_REPOSITORY }}
          flavor: latest=false
          tags: type=raw,value=branch-${{ github.event_name == 'delete' && github.event.ref || github.head_ref || github.ref_name }}

      - name: Determine preview cache reference
        id: cache
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
        run: |
          tag="${IMAGE_TAG##*:}"
          echo "cache_ref=${IMAGE_TAG%:*}:buildcache-$tag" >> "$GITHUB_OUTPUT"

      - if: inputs.BAKE_FILE != ''
        # Deleted branches no longer have a ref to checkout, we need to use the default branch's Bake definition.
        # Should some suffixes or prefixes differ, we cannot reliably delete the preview images.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'delete' && github.event.repository.default_branch || github.event.action == 'closed' && github.event.pull_request.head.sha || github.ref }}

      - if: env.ONLY_CLEANUP == 'false' || inputs.BAKE_FILE != ''
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4

      - if: env.ONLY_CLEANUP == 'false'
        # https://github.com/docker/login-action
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: env.ONLY_CLEANUP == 'false' && inputs.BAKE_FILE == ''
        name: Build and push preview image
        # https://github.com/docker/build-push-action
        uses: docker/build-push-action@v7
        with:
          push: true
          file: ${{ inputs.DOCKERFILE_PATH }}
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ secrets.BUILD_ARGS }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.cache_ref }},mode=max

      - if: env.ONLY_CLEANUP == 'false' && inputs.BAKE_FILE != ''
        name: Bake and push preview images
        uses: docker/bake-action@v7
        env:
          CACHE_REF: ${{ steps.cache.outputs.cache_ref }}
        with:
          source: .
          files: |
            ${{ inputs.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ inputs.BAKE_TARGETS }}
          push: true
          sbom: true
          provenance: true

      ######## Cleanup ########

      # We need to get tags for the actual images and for the cache-to references from the bake file.
      - if: env.ONLY_CLEANUP == 'true' && inputs.BAKE_FILE != ''
        name: Resolve Bake preview tags for cleanup
        id: bake-cleanup
        env:
          BAKE_FILE: ${{ inputs.BAKE_FILE }}
          BAKE_TARGETS: ${{ inputs.BAKE_TARGETS }}
          METADATA_FILE: ${{ steps.meta.outputs.bake-file }}
          CACHE_REF: ${{ steps.cache.outputs.cache_ref }}
        run: |
          mapfile -t targets < <(printf '%s\n' "$BAKE_TARGETS" | sed '/^[[:space:]]*$/d')
          tags=$(docker buildx bake -f "$BAKE_FILE" -f "$METADATA_FILE" --print "${targets[@]}" |
            jq -ec '
              [.target[] | .tags[]?, (.["cache-to"][]? | select(.type == "registry") | .ref)]
              | unique
              | if length == 0 then 
                  error("Bake targets have no preview tags to delete") 
                else 
                  . 
                end
            ')
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - if: env.ONLY_CLEANUP == 'true'
        name: Delete preview image and cache tags
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tags }}
          CACHE_REF: ${{ steps.cache.outputs.cache_ref }}
          BAKE_FILE: ${{ inputs.BAKE_FILE }}
          BAKE_TAGS: ${{ steps.bake-cleanup.outputs.tags }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$BAKE_FILE" ]]; then
            refs=("$IMAGE_TAG" "$CACHE_REF")
          else
            tags=$(jq -er '.[]' <<< "$BAKE_TAGS")
            mapfile -t refs <<< "$tags"
          fi

          credentials=$(jq -n --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" \
            '{username: $username, password: $password}')
          token=$(curl -fsS -H 'Content-Type: application/json' -d "$credentials" \
            https://hub.docker.com/v2/users/login/ | jq -er .token)
          
          echo "::add-mask::$token"
          
          for ref in "${refs[@]}"; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
              "https://hub.docker.com/v2/repositories/${ref%:*}/tags/${ref##*:}/")
            [[ "$status" == 204 || "$status" == 404 ]] || {
              echo "::error::Docker Hub tag deletion failed for $ref: HTTP $status";
              exit 1;
            }
          done
