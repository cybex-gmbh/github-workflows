name: Docker Image CI

on:
  release:
    types: [ published ]
  workflow_dispatch:
  push:
    branches:
      - 'preview/**'
  pull_request:
    types: [ labeled, synchronize, closed ]
  delete:

permissions:
  contents: read

jobs:
  build:
    name: Build and push Docker images
    # https://github.com/cybex-gmbh/github-workflows/blob/main/.github/workflows/build.yml
    uses: cybex-gmbh/github-workflows/.github/workflows/build.yml@main
    with:
      DOCKER_REPOSITORY: cybexwebdev/your-repository
#      DOCKERFILE_PATH: ./path/to/Dockerfile
      # If you want to use Docker Bake
#      BAKE_FILE: docker-bake.hcl
    secrets: inherit
    # If you want to pass build args
#    secrets:
#      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
#      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
#      BUILD_ARGS: |
#        BUILD_ARG_1=value
#        BUILD_ARG_2=value
